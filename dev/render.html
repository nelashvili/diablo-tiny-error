<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Render dev harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d17;
        overflow: hidden;
        touch-action: none;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: absolute;
        right: 8px;
        top: 8px;
        color: #cde;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.5);
        padding: 6px 8px;
        border-radius: 4px;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="hud">click: move | wheel/Z: zoom | F3: stats | Q: quality | S: shake</div>
    </div>
    <script type="module" src="./render.ts"></script>
  </body>
</html>
