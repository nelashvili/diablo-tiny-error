<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VFX Lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d17;
        overflow: hidden;
        font:
          12px/1.3 system-ui,
          sans-serif;
        color: #cfd6ee;
      }
      canvas {
        display: block;
        position: absolute;
        inset: 0;
      }
      #ui {
        z-index: 5;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 190px;
        overflow-y: auto;
        background: rgba(8, 10, 20, 0.82);
        padding: 6px;
        box-sizing: border-box;
      }
      #ui h4 {
        margin: 8px 0 3px;
        color: #8fa0ff;
        font-size: 11px;
        text-transform: uppercase;
      }
      #ui button {
        display: block;
        width: 100%;
        margin: 1px 0;
        padding: 2px 4px;
        text-align: left;
        background: #1b2036;
        color: #dfe5ff;
        border: 1px solid #2c3354;
        border-radius: 3px;
        cursor: pointer;
        font-size: 11px;
      }
      #ui button.on {
        background: #3a4a9a;
      }
      #stats {
        z-index: 5;
        position: absolute;
        right: 8px;
        top: 6px;
        font-family: monospace;
        background: rgba(0, 0, 0, 0.5);
        padding: 3px 6px;
      }
      #stats select {
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="ui"></div>
    <div id="stats">
      <span id="info"></span>
      quality
      <select id="q">
        <option>high</option>
        <option>medium</option>
        <option>low</option>
      </select>
      grade
      <select id="grade">
        <option value="">neutral</option>
        <option>town</option>
        <option>endoor</option>
        <option>tatoonie</option>
        <option>kashyyyyyk</option>
        <option>deafStar</option>
      </select>
    </div>
    <script type="module" src="./vfx.ts"></script>
  </body>
</html>
